<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self';">
    <title>شجرة النسب النبوي الشريف 🌿</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 {
            color: #f4d03f;
            text-shadow: 0 0 10px rgba(244, 208, 63, 0.4);
            margin-bottom: 5px;
            text-align: center;
            font-size: 1.8rem;
        }
        p.subtitle {
            color: #abebc6;
            margin-top: 0;
            margin-bottom: 10px;
            text-align: center;
            font-size: 0.95rem;
        }

        .game-header {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(244, 208, 63, 0.4);
            border-radius: 15px;
            padding: 10px 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .prize-box {
            font-size: 1.1rem;
            font-weight: bold;
            color: #2ecc71;
            background: rgba(46, 204, 113, 0.15);
            padding: 8px 15px;
            border-radius: 20px;
            border: 1px solid #2ecc71;
        }

        .timer-box {
            font-size: 1.2rem;
            font-weight: bold;
            color: #f4d03f;
            background: rgba(244, 208, 63, 0.15);
            padding: 8px 18px;
            border-radius: 20px;
            border: 1px solid #f4d03f;
        }

        .timer-box.warning {
            color: #e74c3c;
            border-color: #e74c3c;
            background: rgba(231, 76, 60, 0.2);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .tree-viewport {
            position: relative;
            width: 100%;
            max-width: 900px;
            background: #ffffff;
            border: 3px solid #27ae60;
            border-radius: 20px;
            padding: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        svg.tree-svg {
            width: 100%;
            height: 720px;
        }

        .leaf-group {
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .leaf-path {
            fill: #e8f8f5;
            stroke: #27ae60;
            stroke-width: 2;
            transition: all 0.2s ease;
        }

        .leaf-slot-empty .leaf-path {
            fill: #ffffff;
            stroke: #27ae60;
            stroke-dasharray: 4 4;
            opacity: 0.9;
        }

        .leaf-group.drag-over .leaf-path {
            fill: #f4d03f;
            stroke: #d35400;
            stroke-width: 3;
            opacity: 1;
            filter: drop-shadow(0 0 8px rgba(244, 208, 63, 0.8));
        }

        .leaf-group.filled .leaf-path {
            fill: #27ae60;
            stroke: #1e8449;
            stroke-width: 3;
            stroke-dasharray: none;
            opacity: 1;
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.2));
        }

        /* تكبير الحجم وتغميق الخط بالكامل */
        .leaf-text {
            font-size: 15px;
            font-weight: 900;
            fill: #ffffff;
            text-anchor: middle;
            dominant-baseline: middle;
            pointer-events: none;
        }

        /* تنسيق الأرقام بدون أقواس بخط كبير وأسود بولد */
        .leaf-text.empty-text {
            fill: #000000;
            font-size: 22px;
            font-weight: 900;
        }

        .bank-container {
            width: 100%;
            max-width: 900px;
            margin-top: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(46, 204, 113, 0.3);
            border-radius: 15px;
            padding: 15px;
            text-align: center;
        }

        .bank-title {
            color: #f4d03f;
            font-size: 1rem;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .names-flex {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        .leaf-btn {
            background: linear-gradient(135deg, #27ae60, #1e8449);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: grab;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            border: 2px solid transparent;
            transition: all 0.2s ease;
        }

        .leaf-btn:active {
            cursor: grabbing;
        }

        .leaf-btn.dragging {
            opacity: 0.4;
            transform: scale(0.95);
        }

        .toast {
            position: fixed;
            bottom: 20px;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            color: white;
            display: none;
            z-index: 100;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }
        .toast.error { background-color: #e74c3c; }
        .toast.success { background-color: #2ecc71; color: #0f2027; }
    </style>
</head>
<body>

    <h1>شجرة النسب النبوي الشريف 🌿</h1>
    <p class="subtitle">اسحب الاسم بالماوس وأسقطه مباشرة فوق رقم الورقة المناسبة</p>

    <div class="game-header">
        <div class="prize-box">🎁 الجائزة الاولى</div>
        <div class="timer-box" id="timerBox">⏳ الوقت المتبقي: ٠٣:٠٠</div>
    </div>

    <div class="tree-viewport">
        <svg class="tree-svg" viewBox="0 0 800 750">
            <path d="M 200,380 C 100,350 80,180 220,100 C 300,30 500,30 580,100 C 720,180 700,350 600,380 C 500,430 300,430 200,380 Z" fill="#e8f8f5" opacity="0.7"/>
            <path d="M 220,360 C 130,330 110,190 240,120 C 320,50 480,50 560,120 C 690,190 670,330 580,360 C 480,410 320,410 220,360 Z" fill="#d4efdf" opacity="0.6"/>

            <g stroke="#795548" stroke-linecap="round" fill="none">
                <path d="M 400,720 Q 395,580 400,450" stroke-width="42"/>
                <path d="M 400,720 Q 405,580 400,450" stroke-width="36" stroke="#5d4037"/>
                
                <path d="M 400,550 Q 320,480 230,420" stroke-width="20"/>
                <path d="M 400,550 Q 480,480 570,420" stroke-width="20"/>
                
                <path d="M 400,480 Q 300,380 180,300" stroke-width="14"/>
                <path d="M 400,480 Q 500,380 620,300" stroke-width="14"/>

                <path d="M 400,420 Q 340,300 250,200" stroke-width="10"/>
                <path d="M 400,420 Q 460,300 550,200" stroke-width="10"/>

                <path d="M 400,380 Q 400,240 400,100" stroke-width="12"/>
            </g>

            <g transform="translate(400, 685)">
                <rect x="-110" y="-30" width="220" height="60" rx="30" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="2" filter="drop-shadow(0 4px 8px rgba(0,0,0,0.3))"/>
                <text x="0" y="5" font-size="20" font-weight="bold" fill="#0f2027" text-anchor="middle">سيدنا محمد ﷺ</text>
            </g>

            <defs>
                <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#f4d03f" />
                    <stop offset="100%" stop-color="#f39c12" />
                </linearGradient>
            </defs>

            <g id="leavesContainer"></g>
        </svg>
    </div>

    <div class="bank-container">
        <div class="bank-title">🌿 اسحب اسم الأب بالماوس وضع الكرسر فوق رقم الورقة:</div>
        <div class="names-flex" id="namesBank"></div>
    </div>

    <div class="toast" id="toastMsg"></div>

<script>
    const ancestryTree = [
        "عبد الله", "عبد المطلب", "هاشم", "عبد مناف", "قصي", 
        "كلاب", "مرة", "كعب", "لؤي", "غالب", 
        "فهر", "مالك", "النضر", "كنانة", "خزيمة", 
        "مدركة", "إلياس", "مضر", "نزار", "معد", "عدنان"
    ];

    const arabicDigits = ["٠", "١", "٢", "٣", "٤", "٥", "٦", "٧", "٨", "٩"];

    // تحويل مباشر للرقم العربي بدون إضافة صفر
    function toArabicNumber(num) {
        return num.toString().replace(/\d/g, d => arabicDigits[d]);
    }

    const leafPositions = [
        {x: 400, y: 600}, {x: 320, y: 530}, {x: 480, y: 530}, {x: 230, y: 450}, {x: 570, y: 450},
        {x: 390, y: 470}, {x: 300, y: 390}, {x: 500, y: 390}, {x: 180, y: 320}, {x: 620, y: 320},
        {x: 400, y: 360}, {x: 320, y: 290}, {x: 480, y: 290}, {x: 230, y: 220}, {x: 570, y: 220},
        {x: 400, y: 250}, {x: 330, y: 160}, {x: 470, y: 160}, {x: 400, y: 150}, {x: 320, y: 80}, {x: 480, y: 80}
    ];

    let draggedName = null;
    let draggedElement = null;
    let completedCount = 0;
    let totalSeconds = 180;
    let timerInterval = null;
    let isGameOver = false;

    const leavesContainer = document.getElementById("leavesContainer");
    const namesBank = document.getElementById("namesBank");
    const toastMsg = document.getElementById("toastMsg");
    const timerBox = document.getElementById("timerBox");
    const leafShapePath = "M 0,-25 C 20,-15 25,10 0,25 C -25,10 -20,-15 0,-25 Z";

    function startTimer() {
        timerInterval = setInterval(() => {
            if (totalSeconds <= 0) {
                clearInterval(timerInterval);
                isGameOver = true;
                timerBox.innerText = "⏳ انتهى الوقت!";
                showToast("انتهى الوقت للأسف! حاول مرة أخرى ⏱️", "error");
                setTimeout(() => alert("❌ انتهت الـ 3 دقائق! حاول مرة أخرى للحصول على الجائزة الاولى!"), 300);
                return;
            }

            totalSeconds--;
            const mins = Math.floor(totalSeconds / 60);
            const secs = totalSeconds % 60;
            
            timerBox.innerText = `⏳ الوقت المتبقي: ${toArabicNumber(mins)}:${secs < 10 ? '٠' + toArabicNumber(secs) : toArabicNumber(secs)}`;

            if (totalSeconds <= 30) {
                timerBox.classList.add("warning");
            }
        }, 1000);
    }

    function initTreeLeaves() {
        ancestryTree.forEach((name, index) => {
            const pos = leafPositions[index];

            const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
            g.setAttribute("class", "leaf-group leaf-slot-empty");
            g.setAttribute("transform", `translate(${pos.x}, ${pos.y})`);
            g.setAttribute("data-index", index);

            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            path.setAttribute("d", leafShapePath);
            path.setAttribute("class", "leaf-path");
            path.setAttribute("transform", "scale(2.2, 1.4)");

            const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
            text.setAttribute("class", "leaf-text empty-text");
            text.setAttribute("y", "2");
            // الرقم العربي فقط بدون أقواس أو أصفار زادت
            text.textContent = toArabicNumber(index + 1);

            g.appendChild(path);
            g.appendChild(text);

            g.addEventListener("dragover", (e) => {
                e.preventDefault();
                if (!g.classList.contains("filled")) {
                    g.classList.add("drag-over");
                }
            });

            g.addEventListener("dragleave", () => {
                g.classList.remove("drag-over");
            });

            g.addEventListener("drop", (e) => {
                e.preventDefault();
                g.classList.remove("drag-over");
                handleDrop(index, g);
            });

            leavesContainer.appendChild(g);
        });
    }

    function initBank() {
        const shuffled = [...ancestryTree].sort(() => Math.random() - 0.5);
        shuffled.forEach(name => {
            const btn = document.createElement("div");
            btn.className = "leaf-btn";
            btn.innerText = name;
            btn.setAttribute("draggable", "true");

            btn.addEventListener("dragstart", (e) => {
                if (isGameOver) return;
                draggedName = name;
                draggedElement = btn;
                btn.classList.add("dragging");
                e.dataTransfer.setData("text/plain", name);
            });

            btn.addEventListener("dragend", () => {
                btn.classList.remove("dragging");
            });

            namesBank.appendChild(btn);
        });
    }

    function handleDrop(slotIndex, leafElement) {
        if (isGameOver || !draggedName) return;

        if (leafElement.classList.contains("filled")) return;

        if (draggedName === ancestryTree[slotIndex]) {
            leafElement.setAttribute("class", "leaf-group filled");
            const textNode = leafElement.querySelector(".leaf-text");
            textNode.textContent = "بن " + draggedName;
            textNode.setAttribute("class", "leaf-text");

            draggedElement.remove();
            draggedName = null;
            draggedElement = null;
            showToast("إجابة صحيحة! 🌿", "success");

            completedCount++;
            if (completedCount === ancestryTree.length) {
                clearInterval(timerInterval);
                setTimeout(() => {
                    alert("🎉 ألف مبروك! نجحت في ترتيب شجرة النسب الشريف قبل انتهاء الوقت وتستحق الجائزة الاولى! 🏆");
                }, 300);
            }
        } else {
            showToast("مكان خاطئ! جرب ورقة أخرى.", "error");
        }
    }

    function showToast(msg, type) {
        toastMsg.innerText = msg;
        toastMsg.className = `toast ${type}`;
        toastMsg.style.display = "block";
        setTimeout(() => { toastMsg.style.display = "none"; }, 2000);
    }

    initTreeLeaves();
    initBank();
    startTimer();
</script>

</body>
</html>
