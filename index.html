<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لغز نسب النبي ﷺ - التحدي الموقوت</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
            text-align: center;
        }
        h2 {
            color: #1b4332;
            margin-top: 0;
            margin-bottom: 15px;
        }
        .timer-box {
            font-size: 1.4rem;
            font-weight: bold;
            color: #d90429;
            background-color: #ffe6e6;
            border: 2px solid #ffb3b3;
            padding: 10px 20px;
            border-radius: 8px;
            display: inline-block;
            margin-bottom: 20px;
        }
        .tree-box {
            background-color: #e8f5e9;
            border: 2px dashed #2d6a4f;
            padding: 15px;
            border-radius: 10px;
            font-size: 1.2rem;
            color: #2d6a4f;
            min-height: 80px;
            margin-bottom: 20px;
            line-height: 1.8;
            word-wrap: break-word;
        }
        .input-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 15px;
        }
        input[type="text"] {
            padding: 12px 15px;
            font-size: 1rem;
            border: 2px solid #ccc;
            border-radius: 8px;
            width: 65%;
            text-align: center;
            outline: none;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            border-color: #52b788;
        }
        button {
            padding: 12px 25px;
            font-size: 1rem;
            background-color: #2d6a4f;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #1b4332;
        }
        .progress {
            background-color: #e0e0e0;
            border-radius: 10px;
            height: 15px;
            width: 100%;
            overflow: hidden;
            margin-top: 20px;
        }
        .progress-bar {
            background-color: #52b788;
            height: 100%;
            width: 0%;
            transition: width 0.4s ease;
        }
        .error-msg {
            color: #d90429;
            font-weight: bold;
            height: 24px;
            margin-top: 5px;
        }
        .result-msg {
            font-size: 1.2rem;
            font-weight: bold;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }
        .win-msg {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .lose-msg {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>تحدي نسب النبي الشريف ﷺ (3 دقائق)</h2>
    
    <div class="timer-box">
        الوقت المتبقي: <span id="timer">03:00</span>
    </div>

    <div class="tree-box" id="chainBox">
        محمد ﷺ بن ...
    </div>

    <div class="input-group" id="controls">
        <input type="text" id="userInput" placeholder="اكتب الاسم هنا" autofocus autocomplete="off">
        <button onclick="checkAnswer()">تأكيد</button>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <div class="progress">
        <div class="progress-bar" id="progressBar"></div>
    </div>
    
    <div id="finalMessage"></div>
</div>

<script>
    // شجرة النسب المتفق عليها إلى عدنان
    const ancestry = [
        "عبد الله", "عبد المطلب", "هاشم", "عبد مناف", "قصي", 
        "كلاب", "مرة", "كعب", "لؤي", "غالب", 
        "فهر", "مالك", "النضر", "كنانة", "خزيمة", 
        "مدركة", "إلياس", "مضر", "نزار", "معد", "عدنان"
    ];

    let currentIndex = 0;
    let timeLeft = 180; // 3 دقائق = 180 ثانية
    let timerInterval = null;

    // دالة بدء العداد التنازلي
    function startTimer() {
        timerInterval = setInterval(function() {
            timeLeft--;
            
            let minutes = Math.floor(timeLeft / 60);
            let seconds = timeLeft % 60;
            
            // إضافة صفر على اليسار إذا كان الأرقام أقل من 10
            let displayMinutes = minutes < 10 ? "0" + minutes : minutes;
            let displaySeconds = seconds < 10 ? "0" + seconds : seconds;
            
            document.getElementById("timer").innerText = displayMinutes + ":" + displaySeconds;

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                timeOut();
            }
        }, 1000);
    }

    // انتهاء الوقت
    function timeOut() {
        document.getElementById("controls").style.display = "none";
        document.getElementById("errorMsg").innerText = "";
        document.getElementById("finalMessage").innerHTML = 
            "<div class='result-msg lose-msg'>للأسف انتهى الوقت! حاول مرة أخرى في وقت لاحق.</div>";
    }

    // دالة لتسهيل مقارنة النصوص وتجاهل الهمزات والمسافات الزائدة
    function normalize(text) {
        return text.trim()
            .replace(/[أإآ]/g, "ا")
            .replace(/\s+/g, " ");
    }

    function checkAnswer() {
        if (timeLeft <= 0) return;

        const inputElem = document.getElementById("userInput");
        const errorElem = document.getElementById("errorMsg");
        const userValue = normalize(inputElem.value);
        const correctValue = normalize(ancestry[currentIndex]);

        if (userValue === "") return;

        if (userValue === correctValue) {
            errorElem.innerText = "";
            const currentChain = document.getElementById("chainBox");
            
            // إضافة الاسم الصحيح للشجرة
            currentChain.innerText = currentChain.innerText.replace("...", ancestry[currentIndex]);
            
            currentIndex++;

            // تحديث شريط التقدم
            const progressPercent = (currentIndex / ancestry.length) * 100;
            document.getElementById("progressBar").style.width = progressPercent + "%";

            if (currentIndex < ancestry.length) {
                currentChain.innerText += " بن ...";
                inputElem.value = "";
                inputElem.focus();
            } else {
                // الفوز بالطريقة الصحيحة
                clearInterval(timerInterval);
                currentChain.innerText += " (وصلت إلى عدنان)";
                document.getElementById("controls").style.display = "none";
                document.getElementById("finalMessage").innerHTML = 
                    "<div class='result-msg win-msg'>🎉 مبروك كسبت ١٠٠ جنيه مكافأة على حفظك لنسب نبيك صلى الله عليه وسلم! 🎉</div>";
            }
        } else {
            // إجابة خاطئة: مسح التكست وإظهار الرسالة
            errorElem.innerText = "إجابة خاطئة! حاول مرة أخرى.";
            inputElem.value = "";
            inputElem.focus();
        }
    }

    // السماح بالضغط على زر Enter للإرسال
    document.getElementById("userInput").addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            checkAnswer();
        }
    });

    // تشغيل العداد عند فتح الصفحة
    window.onload = startTimer;
</script>

</body>
</html>
